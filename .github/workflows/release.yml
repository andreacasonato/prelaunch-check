# Publishes the CLI to npm when a v* tag is pushed (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Uses npm trusted publishing (OIDC): no npm token is stored in this repository, and npm adds
# provenance automatically. Configure the trusted publisher on npmjs.com for this workflow file.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never use caching in release builds
      - name: Check the tag matches the CLI version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(node -p "require('./packages/cli/package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then echo "Tag $TAG doesn't match packages/cli version $VERSION"; exit 1; fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --workspace packages/cli
